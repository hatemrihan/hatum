[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  # Disable functions for static export
  directory = "netlify/functions"

[[redirects]]
  from = "/hatum/*"
  to = "/hatum/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 