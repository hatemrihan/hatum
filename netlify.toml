[build]
  command = "npm install --force && NODE_ENV=production npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--force"

# Fix MIME types for video files
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "*.octet-stream"
  [headers.values]
    Content-Type = "video/mp4"

[[headers]]
  for = "/videos/*.octet-stream"
  [headers.values]
    Content-Type = "video/mp4"